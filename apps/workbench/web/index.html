<script>
const $ = (s) => document.querySelector(s);
let APPS = [];
let META = { builtBy: [], categories: [] };
let HEALTH = {};
let UPTIME = {};
let CHECKED_AT = null;
let VIEW = 'all';

/* ---------------- 主题 ---------------- */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('workbench-theme', t); } catch (e) {}
  $('#theme-icon').innerHTML = `<use href="#i-${t === 'dark' ? 'sun' : 'moon'}"/>`;
  $('#theme-label').textContent = t === 'dark' ? '浅色模式' : '深色模式';
}
$('#theme-toggle').addEventListener('click', () => {
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
});
applyTheme(document.documentElement.dataset.theme || 'light');

/* ---------------- 数据 ---------------- */
async function load() {
  const r = await fetch('/api/apps').then(r => r.json());
  APPS = r.apps || [];
  META = r.meta || META;
  fillSelect('#f-cat', META.categories, '全部分类');
  fillSelect('#f-by', META.builtBy, '全部来源');
  fillSelect('[name=category]', META.categories);
  fillSelect('[name=builtBy]', META.builtBy);
  renderSideCats();
  render();
}

function fillSelect(sel, items, first) {
  const el = $(sel);
  const cur = el.value;
  el.innerHTML = (first ? `<option value="">${first}</option>` : '') +
    items.map(x => `<option value="${x}">${x}</option>`).join('');
  if (cur) el.value = cur;
}

const CAT_ICON = {
  '内容生产': 'i-layers', '数据看板': 'i-chart', '业务系统': 'i-grid',
  '素材管理': 'i-folder', '开发工具': 'i-tool', '自动化': 'i-bolt', '其他': 'i-box',
};

function renderSideCats() {
  const counts = {};
  APPS.forEach(a => counts[a.category] = (counts[a.category] || 0) + 1);
  const items = META.categories.filter(c => counts[c]);
  $('#side-cats').innerHTML = '<div class="side-label">分类</div>' + items.map(c =>
    `<button class="side-item ${VIEW === 'cat:' + c ? 'on' : ''}" data-view="cat:${c}">
      <svg class="icon"><use href="#${CAT_ICON[c] || 'i-box'}"/></svg>${c}<span class="n">${counts[c]}</span></button>`).join('');
}

function visibleApps() {
  const q = $('#q').value.trim().toLowerCase();
  const cat = $('#f-cat').value, by = $('#f-by').value;
  return APPS.filter(a => {
    if (by && a.builtBy !== by) return false;
    if (cat && a.category !== cat) return false;
    if (VIEW === 'running' && HEALTH[a.id]?.local?.status !== 'up') return false;
    if (VIEW === 'dirty' && !isUnsynced(a)) return false;
    if (VIEW === 'repo' && !a.repo) return false;
    if (VIEW.startsWith('cat:') && a.category !== VIEW.slice(4)) return false;
    if (q && !(a.name + a.purpose + (a.tags || []).join('') + a.notes).toLowerCase().includes(q)) return false;
    return true;
  });
}

function render() {
  const list = visibleApps();
  $('#grid').innerHTML = list.map(card).join('') +
    `<button class="add-row" id="btn-discover-row"><svg class="icon"><use href="#i-radar"/></svg>自动发现本机应用</button>`;
  $('#empty').hidden = list.length > 0;
  $('#s-total').textContent = APPS.length;
  $('#s-repo').textContent = APPS.filter(a => a.repo).length;
  const upN = Object.values(HEALTH).filter(h => h.local?.status === 'up').length;
  const dirtyN = APPS.filter(isUnsynced).length;
  $('#s-up').textContent = upN;
  $('#n-all').textContent = APPS.length;
  $('#n-running').textContent = upN;
  $('#n-dirty').textContent = dirtyN;
  $('#n-repo').textContent = APPS.filter(a => a.repo).length;
  $('#side-ratio').textContent = `${upN} / ${APPS.length}`;
  $('#side-fill').style.width = APPS.length ? `${Math.round(upN / APPS.length * 100)}%` : '0%';
  // 侧栏那句给个具体时间点，比一个跨应用平均的百分比诚实（有的应用本来就不打算常开）
  $('#side-uptime').textContent = CHECKED_AT
    ? `最近检查 ${new Date(CHECKED_AT).toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit' })}`
    : '尚未检查';
  $('#btn-check').title = CHECKED_AT
    ? `上次检查 ${new Date(CHECKED_AT).toLocaleTimeString('zh-CN', { hour12: false })}`
    : '检查状态';
}

function dot(h) {
  if (!h) return '<i class="dot none" title="未探测"></i>';
  const s = h.status === 'up' ? (h.warn ? 'up warn' : 'up') : h.status === 'down' ? 'down' : 'none';
  const txt = h.status === 'up'
    ? `${h.code || 200}${h.ms != null ? ' · ' + h.ms + 'ms' : ''}${h.warn ? ' · ' + (h.detail || '有异常') : ''}`
    : (h.detail || (h.status === 'down' ? '不可达' : '未配置'));
  return `<i class="dot ${s}" title="${esc(txt)}"></i>`;
}

/* ---------------- 本地 ↔ GitHub 同步状态 ---------------- */
function isUnsynced(a) {
  const g = HEALTH[a.id]?.git;
  return !!(g && g.state === 'ok' && g.unsynced);
}

// 卡片正面只放「最该处理的那一条」，其余细节进详情。
// 主数字用 modified（已跟踪文件的真实改动）—— 未跟踪文件里常混着运行时产物，
// 拿它当「忘了同步」的证据会把 workspace 那种大仓库报成 800 多个，纯噪音。
function gitSummary(g) {
  if (!g || g.state !== 'ok') return null;
  const mod = g.modified || 0;
  const unt = g.untracked || 0;
  const extraUnt = unt ? (mod ? `另有 ${unt} 个未跟踪文件` : '都是还没纳入版本控制的新文件') : '';
  if (g.noRemote) return { text: '本地没有 origin', cls: 'bad', extra: '登记的仓库在本地推不上去' };
  if (g.repoMismatch) return { text: '仓库对不上', cls: 'bad', extra: '登记的 GitHub 与本地 origin 不是同一个' };
  if (!g.upstream) return { text: '分支未关联远端', cls: 'mid', extra: `当前在 ${g.branch || '?'} 上，还没设 upstream` };
  if ((mod || unt) && g.ahead > 0) return { text: `${mod || unt} 个${mod ? '改动' : '新文件'}未提交`, cls: 'mid', extra: `另有 ${g.ahead} 个提交未推送` };
  if (mod || unt) return { text: `${mod || unt} 个${mod ? '改动' : '新文件'}未提交`, cls: 'mid', extra: extraUnt || '改完记得 commit + push' };
  if (g.ahead > 0) return { text: `${g.ahead} 个提交未推送`, cls: 'mid', extra: 'commit 有了，还没上 GitHub' };
  if (g.behind > 0) return { text: `远端领先 ${g.behind} 个`, cls: 'mid', extra: '该 pull 一下了' };
  return { text: '已同步', cls: 'ok', extra: '工作区干净，提交也在 GitHub 上' };
}

function gitBanner(a) {
  const g = HEALTH[a.id]?.git;
  if (!g || g.state !== 'ok' || !g.unsynced) return '';
  const bits = [];
  if (g.modified) bits.push(`${g.modified} 个改动未提交`);
  else if (g.untracked) bits.push(`${g.untracked} 个新文件未提交`);
  if (g.ahead > 0) bits.push(`${g.ahead} 个提交未推送`);
  if (g.noRemote) bits.push('本地无 origin');
  if (g.repoMismatch) bits.push('登记仓库与本地不符');
  if (!g.upstream && !g.noRemote && !g.repoMismatch) bits.push('分支未关联远端');
  if (!bits.length) bits.push('有内容没同步');
  return `<button class="git-banner" type="button" data-expand="${a.id}" title="点开看具体改了哪些文件">
    <svg class="icon"><use href="#i-git"/></svg>
    <span>${esc(bits.join(' · '))}</span>
    <em>${esc(g.name)}</em>
  </button>`;
}

function gitRows(a, g) {
  if (!g || g.state !== 'ok') return [];
  const s = gitSummary(g);
  const rows = [];
  const repoLine = [g.name, g.upstream || (g.branch ? `${g.branch}（无 upstream）` : '')].filter(Boolean).join(' · ');
  const detail = [];
  if (g.modified) detail.push(`${g.modified} 个已跟踪文件改动`);
  if (g.untracked) detail.push(`${g.untracked} 个未跟踪文件`);
  if (g.ahead) detail.push(`领先 ${g.ahead}`);
  if (g.behind) detail.push(`落后 ${g.behind}`);
  if (g.fetchedAt) {
    const stale = g.ahead > 0 && (Date.now() - new Date(g.fetchedAt).getTime()) > 86400000;
    detail.push(`上次 fetch ${when(g.fetchedAt)}${stale ? '，领先数可能偏大' : ''}`);
  }
  rows.push(`<div class="probe-row"><span>Git</span><b class="${s.cls}">${esc(s.text)}</b><em>${esc(repoLine)}${detail.length ? ' · ' + esc(detail.join(' · ')) : ''}</em></div>`);
  if (g.lastCommit) {
    rows.push(`<div class="probe-row"><span>提交</span><b>${esc(g.lastCommit.hash)}</b><em>${esc(when(g.lastCommit.at))} · ${esc(g.lastCommit.subject.slice(0, 60))}</em></div>`);
  }
  const sample = g.files?.length ? g.files : (g.untrackedSample || []);
  const sampleTotal = g.files?.length ? g.modified : g.untracked;
  if (sample.length) {
    rows.push(`<div class="probe-row"><span>改动</span><b class="mid">${sampleTotal}</b><em>${esc(sample.join(' · '))}${sampleTotal > sample.length ? ' …' : ''}</em></div>`);
  }
  return rows;
}

function when(iso) {
  if (!iso) return '';
  const t = new Date(iso).getTime();
  if (Number.isNaN(t)) return '';
  const mins = Math.round((Date.now() - t) / 60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return `${mins} 分钟前`;
  if (mins < 60 * 24) return `${Math.round(mins / 60)} 小时前`;
  if (mins < 60 * 24 * 30) return `${Math.round(mins / 1440)} 天前`;
  return iso.slice(0, 10);
}

// 「谁在这个端口上」—— 光有状态码不够，被别的进程占了也会返回 200
function procLine(h) {
  const w = h?.ownership || {};
  if (!w.port) return '';
  if (!w.pid) return w.detail || '';
  const parts = [`${w.cmd || '进程'} pid ${w.pid}`];
  const lc = h.launchd;
  if (lc?.running && lc.pid === w.pid) parts.push('launchd 托管');
  else if (lc?.running) parts.push(`launchd 另起 pid ${lc.pid}`);
  else if (lc?.loaded) parts.push('launchd 已加载未运行');
  else if (lc && lc.loaded === false) parts.push('launchd 未加载');
  if (w.verified === false) parts.push('目录与登记不符');
  return parts.join(' · ');
}

function probeBlock(a, h, u, g) {
  if (!h) return '';
  const rows = [];
  const cls = (x) => (x?.status === 'up' ? (x.warn ? 'mid' : 'ok') : x?.status === 'down' ? 'bad' : '');
  const val = (x) => {
    if (!x) return '未探测';
    if (x.status === 'up') return `${x.code || 200}${x.ms != null ? ' · ' + x.ms + 'ms' : ''}`;
    if (x.status === 'none') return '未配置';
    return x.detail || '不可达';
  };
  if (a.localUrl) rows.push(`<div class="probe-row"><span>本地</span><b class="${cls(h.local)}">${esc(val(h.local))}</b><em>${esc(procLine(h) || h.local?.detail || '')}</em></div>`);
  if (a.onlineUrl) rows.push(`<div class="probe-row"><span>线上</span><b class="${cls(h.online)}">${esc(val(h.online))}</b><em>${esc(h.online?.status === 'up' ? '' : (h.online?.detail || ''))}</em></div>`);
  if (u?.samples && a.localUrl) {
    const p = u.localPct;
    const c = p >= 95 ? 'ok' : p >= 60 ? 'mid' : 'bad';
    rows.push(`<div class="probe-row"><span>24h</span><b class="${c}">${p}%</b><em>${u.samples} 次采样 · 最后一次 ${new Date(u.lastAt).toLocaleTimeString('zh-CN', { hour12: false })}</em></div>`);
  }
  rows.push(...gitRows(a, g));
  if (!rows.length) return '';
  // 只有本地真有远端时才给「核实」按钮 —— 否则点了必然报错
  const verify = g?.state === 'ok' && g.remoteUrl
    ? `<div class="git-verify"><button class="btn sm" data-gitverify="${a.id}"><svg class="icon"><use href="#i-sync"/></svg>对远端核实</button><span class="git-verify-out"></span></div>`
    : '';
  return `<div class="probe">${rows.join('')}</div>${verify}`;
}

function card(a) {
  const h = HEALTH[a.id];
  const links = [];
  if (a.repo) links.push(`<a href="${a.repo}" target="_blank" rel="noreferrer"><svg class="icon"><use href="#i-github"/></svg>GitHub</a>`);

  // 常驻地址区：本地 / 线上 直接可点，这是最常用的入口
  const addrs = [];
  if (a.localUrl) addrs.push(`<a class="local" href="${a.localUrl}" target="_blank" rel="noreferrer" title="${esc(a.localUrl)}">
      <svg class="icon"><use href="#i-laptop"/></svg>本地 ${dot(h?.local)}<span class="url">${esc(a.localUrl.replace(/^https?:\/\//, ''))}</span></a>`);
  if (a.onlineUrl) addrs.push(`<a class="online" href="${a.onlineUrl}" target="_blank" rel="noreferrer" title="${esc(a.onlineUrl)}">
      <svg class="icon"><use href="#i-globe"/></svg>线上 ${dot(h?.online)}<span class="url">${esc(a.onlineUrl.replace(/^https?:\/\//, ''))}</span></a>`);

  const cmds = [];
  if (a.localStart) cmds.push(`<div class="cmd">
      <div class="cmd-head"><svg class="icon"><use href="#i-play"/></svg>本地启动</div>
      <code>${esc(a.localStart)}</code>
      <div class="cmd-acts">
        <button class="btn sm" data-copy="${esc(a.localStart)}"><svg class="icon"><use href="#i-copy"/></svg>复制</button>
        <button class="btn sm" data-run="start" data-id="${a.id}"><svg class="icon"><use href="#i-terminal"/></svg>执行</button>
      </div></div>`);
  if (a.onlineUpdate) cmds.push(`<div class="cmd">
      <div class="cmd-head"><svg class="icon"><use href="#i-upload"/></svg>线上更新</div>
      <code>${esc(a.onlineUpdate)}</code>
      <div class="cmd-acts">
        <button class="btn sm" data-copy="${esc(a.onlineUpdate)}"><svg class="icon"><use href="#i-copy"/></svg>复制</button>
        <button class="btn sm" data-run="update" data-id="${a.id}"><svg class="icon"><use href="#i-terminal"/></svg>执行</button>
      </div></div>`);

  const meta = [];
  if (a.localPath) meta.push(`<span title="${esc(a.localPath)}"><svg class="icon"><use href="#i-folder"/></svg>${esc(a.localPath.split('/').slice(-2).join('/'))}</span>`);
  if (a.launchd) meta.push(`<span title="${esc(a.launchd)}"><svg class="icon"><use href="#i-cog"/></svg>${esc(a.launchd)}</span>`);
  if (a.deployTarget) meta.push(`<span><svg class="icon"><use href="#i-cloud"/></svg>${esc(a.deployTarget)}</span>`);
  (a.tags || []).forEach(t => meta.push(`<span><svg class="icon"><use href="#i-tag"/></svg>${esc(t)}</span>`));

  const ops = a.launchd ? `<div class="cmd-acts">
      <button class="btn sm" data-lcd="restart" data-label="${esc(a.launchd)}"><svg class="icon"><use href="#i-refresh"/></svg>重启常驻</button>
      <button class="btn sm" data-lcd="status" data-label="${esc(a.launchd)}"><svg class="icon"><use href="#i-info"/></svg>查状态</button>
    </div>` : '';

  // 主操作就是地址区本身：本地/线上直接点开，不再另设重复的「打开本地」按钮

  const running = h?.local?.status === 'up';
  const statusLabel = running ? '运行中' : (h?.local?.status === 'down' ? '未运行' : '未探测');
  const down = h?.local?.status === 'down';
  const statusCls = running ? 'on' : (down ? 'off run' : 'off');
  const statusTip = h?.local?.detail || (running ? '本地端口正常响应' : '点右上角刷新按钮重新检查');
  return `<article class="card${running ? ' live' : ''}" data-id="${a.id}">
    <div class="card-head">
      <span class="avatar${a.category === '自动化' ? ' accent' : ''}"><svg class="icon"><use href="#${CAT_ICON[a.category] || 'i-box'}"/></svg></span>
      <div class="card-title">
        <h3>${esc(a.name)}</h3>
        <span class="cat">${esc(a.category)} · ${esc(a.builtBy)}</span>
      </div>
      <span class="badge ${statusCls}" title="${esc(statusTip)}"><i class="dot${running && h?.local?.warn ? ' warn' : ''}"></i>${statusLabel}</span>
    </div>
    <p class="purpose">${esc(a.purpose) || '<span class="dim">未填写用途</span>'}</p>
    ${gitBanner(a)}
    <div class="card-actions">
      ${addrs.length ? `<div class="addresses">${addrs.join('')}</div>` : '<span class="noaddr">未配置访问地址</span>'}
      <details class="more">
        <summary><svg class="icon"><use href="#i-chevron"/></svg>详情</summary>
        <div class="more-body">
          <div class="links">${links.join('') || '<span class="dim">未配置地址</span>'}</div>
          ${probeBlock(a, h, UPTIME[a.id], h?.git)}
          ${cmds.join('')}
          <div class="meta">${meta.join('')}</div>
          ${ops}
          ${a.notes ? `<p class="notes">${esc(a.notes)}</p>` : ''}
          <div class="cmd-acts">
            <button class="btn sm" data-edit="${a.id}"><svg class="icon"><use href="#i-edit"/></svg>编辑</button>
          </div>
        </div>
      </details>
    </div>
  </article>`;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ---------------- 交互 ---------------- */
document.addEventListener('click', async (e) => {
  const t = e.target.closest('button, a, .side-item');
  if (!t) return;
  if (t.dataset.copy) { await navigator.clipboard.writeText(t.dataset.copy); flash(t, '已复制'); }
  else if (t.dataset.edit) openEdit(t.dataset.edit);
  else if (t.dataset.run) run(t.dataset.id, t.dataset.run);
  else if (t.dataset.lcd) launchd(t.dataset.label, t.dataset.lcd, t);
  else if (t.dataset.expand) expandCard(t.dataset.expand, t);
  else if (t.dataset.gitverify) verifyGit(t.dataset.gitverify, t);
  else if (t.id === 'btn-discover-row') discover();
  else if (t.dataset.view) {
    VIEW = t.dataset.view;
    document.querySelectorAll('.side-item[data-view]').forEach(x => x.classList.toggle('on', x.dataset.view === VIEW));
    if (VIEW.startsWith('cat:')) $('#f-cat').value = VIEW.slice(4); else $('#f-cat').value = '';
    renderSideCats(); render();
  }
});

function flash(btn, msg) {
  const old = btn.innerHTML;
  btn.innerHTML = msg;
  setTimeout(() => (btn.innerHTML = old), 1200);
}

async function run(appId, kind) {
  const app = APPS.find(a => a.id === appId);
  const cmd = kind === 'start' ? app.localStart : app.onlineUpdate;
  if (!confirm(`确认执行？\n\n${cmd}`)) return;
  $('#c-title').textContent = kind === 'start' ? `执行：${app.name} 启动` : `执行：${app.name} 线上更新`;
  $('#c-out').textContent = '$ ' + cmd + '\n\n(运行中…)\n';
  $('#console').hidden = false;
  const r = await fetch('/api/run', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ appId, kind }),
  }).then(r => r.json());
  if (r.error) { $('#c-out').textContent = '错误：' + r.error; return; }
  const poll = async () => {
    const rec = await fetch('/api/run/' + r.runId).then(r => r.json()).catch(() => null);
    if (!rec) return;
    $('#c-out').textContent = '$ ' + cmd + '\n\n' + (rec.stdout || '') + (rec.stderr ? '\n[stderr]\n' + rec.stderr : '');
    if (rec.status === 'running') setTimeout(poll, 900);
    else {
      $('#c-out').textContent += `\n\n— 退出码 ${rec.code ?? '?'} · ${rec.status === 'done' ? '完成' : '出错'} —`;
      if (kind === 'start') check();
    }
  };
  poll();
}

async function launchd(label, action, btn) {
  const old = btn.innerHTML;
  btn.innerHTML = '处理中…';
  const r = await fetch('/api/launchd', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ label, action }),
  }).then(r => r.json()).catch(() => ({ error: '请求失败' }));
  btn.innerHTML = r.error ? '失败' : (action === 'restart' ? '已重启' : (r.running ? '运行中' : '未运行'));
  setTimeout(() => { btn.innerHTML = old; if (action === 'restart') check(); }, 1600);
}

function applyHealth(r) {
  if (!r) return;
  HEALTH = {}; (r.results || []).forEach(x => (HEALTH[x.id] = x));
  UPTIME = r.uptime || {};
  if (r.checkedAt) CHECKED_AT = r.checkedAt;
}

// 先用上一轮落盘的快照渲染，页面一打开就有状态，不用干等探活
async function loadHealth() {
  const r = await fetch('/api/health').then(r => r.json()).catch(() => null);
  applyHealth(r); render();
}

async function check() {
  const btn = $('#btn-check');
  btn.classList.add('busy');
  try {
    const r = await fetch('/api/check', { method: 'POST' }).then(r => r.json());
    applyHealth(r); render();
  } catch (e) {
    /* 探活失败不影响已有状态展示 */
  } finally {
    btn.classList.remove('busy');
  }
}

function expandCard(id, btn) {
  const card = btn.closest('.card') || document.querySelector(`.card[data-id="${id}"]`);
  const d = card?.querySelector('details.more');
  if (d) d.open = true;
}

// 探活里的领先/落后是拿本地缓存算的，这里真去问 GitHub 一次
async function verifyGit(id, btn) {
  const old = btn.innerHTML;
  const out = btn.parentElement?.querySelector('.git-verify-out');
  btn.disabled = true;
  btn.innerHTML = '核实中…';
  let r;
  try {
    r = await fetch('/api/git/verify', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id }),
    }).then(x => x.json());
  } catch (e) { r = { error: '请求失败' }; }
  btn.disabled = false;
  btn.innerHTML = old;
  if (!out) return;
  let txt, cls;
  if (r.error) { txt = r.error; cls = 'bad'; }
  else if (r.same) {
    txt = `GitHub 上就是这个提交 ${r.headSha.slice(0, 7)}`;
    cls = r.dirty ? 'mid' : 'ok';
    if (r.dirty) txt += `，但有 ${r.dirty} 个改动没提交`;
  } else if (r.ahead == null) {
    txt = `远端是 ${String(r.remoteSha || '').slice(0, 7)}，本地还没有这个提交，先 fetch`;
    cls = 'mid';
  } else {
    txt = `本地比 GitHub 多 ${r.ahead} 个提交（远端 ${String(r.remoteSha || '').slice(0, 7)}）`;
    cls = 'mid';
  }
  out.textContent = txt;
  out.className = `git-verify-out ${cls}`;
}

async function discover() {
  $('#discover').hidden = false;
  $('#discover').innerHTML = '<div class="loading"><svg class="icon"><use href="#i-radar"/></svg>扫描本机端口、launchd 与 GitHub 仓库…</div>';
  const d = await fetch('/api/discover').then(r => r.json());
  const ports = d.ports.map(p => `<span class="chip"><svg class="icon"><use href="#i-laptop"/></svg>:${p.port} <b>${esc(p.cmd)}</b> pid ${p.pid}</span>`).join('') || '<span class="dim">无</span>';
  const agents = d.launchd.map(x => `<span class="chip"><svg class="icon"><use href="#i-cog"/></svg>${esc(x)}</span>`).join('') || '<span class="dim">无</span>';
  const repos = d.repos.map(r => `<span class="chip"><svg class="icon"><use href="#i-github"/></svg><a href="${r.url}" target="_blank" rel="noreferrer">${esc(r.name)}</a> ${esc((r.pushedAt || '').slice(0, 10))}</span>`).join('') || '<span class="dim">无</span>';
  $('#discover').innerHTML = `
    <h4><svg class="icon"><use href="#i-laptop"/></svg>本机监听端口</h4><div class="chips">${ports}</div>
    <h4><svg class="icon"><use href="#i-cog"/></svg>launchd 常驻</h4><div class="chips">${agents}</div>
    <h4><svg class="icon"><use href="#i-github"/></svg>GitHub 仓库</h4><div class="chips">${repos}</div>`;
}

/* ---------------- 弹窗 ---------------- */
let editing = null;
function openEdit(id) {
  editing = id ? APPS.find(a => a.id === id) : null;
  $('#m-title').textContent = editing ? '编辑应用' : '新建应用';
  const f = $('#form');
  const v = editing || { name: '', id: '', purpose: '', category: '其他', builtBy: 'openclaw', localUrl: '', onlineUrl: '', repo: '', localPath: '', deployTarget: '', localStart: '', onlineUpdate: '', launchd: '', tags: [], notes: '' };
  f.name.value = v.name; f.id.value = v.id; f.purpose.value = v.purpose || '';
  f.category.value = v.category; f.builtBy.value = v.builtBy;
  f.localUrl.value = v.localUrl || ''; f.onlineUrl.value = v.onlineUrl || '';
  f.repo.value = v.repo || ''; f.localPath.value = v.localPath || '';
  f.deployTarget.value = v.deployTarget || '';
  f.localStart.value = v.localStart || ''; f.onlineUpdate.value = v.onlineUpdate || '';
  f.launchd.value = v.launchd || ''; f.tags.value = (v.tags || []).join(',');
  f.notes.value = v.notes || '';
  $('#modal').hidden = false;
  setTimeout(() => f.name.focus(), 60);
}
$('#btn-new').addEventListener('click', () => openEdit(null));
$('#m-close').addEventListener('click', () => ($('#modal').hidden = true));
$('#m-cancel').addEventListener('click', () => ($('#modal').hidden = true));
$('#c-close').addEventListener('click', () => ($('#console').hidden = true));
$('#c-done').addEventListener('click', () => ($('#console').hidden = true));
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { $('#modal').hidden = true; $('#console').hidden = true; }
});

$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const body = {
    name: f.name.value, id: f.id.value, purpose: f.purpose.value,
    category: f.category.value, builtBy: f.builtBy.value,
    localUrl: f.localUrl.value, onlineUrl: f.onlineUrl.value, repo: f.repo.value,
    localPath: f.localPath.value, deployTarget: f.deployTarget.value,
    localStart: f.localStart.value, onlineUpdate: f.onlineUpdate.value,
    launchd: f.launchd.value, notes: f.notes.value,
    tags: f.tags.value.split(/[,，]/).map(s => s.trim()).filter(Boolean),
  };
  await fetch('/api/apps', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  $('#modal').hidden = true;
  await load();
});

$('#btn-check').addEventListener('click', check);
$('#btn-export').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = '/api/export.md';
  a.download = `应用工作台-${new Date().toISOString().slice(0, 10)}.md`;
  a.click();
});
$('#q').addEventListener('input', render);
$('#f-cat').addEventListener('change', () => { VIEW = 'all'; document.querySelectorAll('.side-item[data-view]').forEach(x => x.classList.remove('on')); renderSideCats(); render(); });
$('#f-by').addEventListener('change', render);

load().then(() => { loadHealth(); check(); });
</script>
</body>
